# /etc/bluetooth/main.conf — managed by sys-cfg (decman/modules/hardware/bluetooth.py)

[General]
# Default is "never": if a paired device shows up with a link key BlueZ no
# longer recognizes (reset, or re-paired with another host), BlueZ silently
# refuses the connection instead of re-pairing. "always" re-pairs
# transparently — fixes org.bluez.Error.Failed br-connection-key-missing.
JustWorksRepairing = always
FastConnectable = true
MultiProfile = multiple
# needed for battery % (BlueZ Battery Provider API)
Experimental = true

[Policy]
AutoEnable = true
