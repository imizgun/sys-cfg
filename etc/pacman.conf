# /etc/pacman.conf — managed by sys-cfg (decman/modules/core/pacman.py)
# See pacman.conf(5).

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# 32-bit libs for Steam / lib32-mesa / lib32-pipewire
[multilib]
Include = /etc/pacman.d/mirrorlist
