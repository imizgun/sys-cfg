#!/usr/bin/nft -f
# managed by sys-cfg (decman/modules/core/firewall.py)
# Inbound default-deny, the equivalent of NixOS' default networking.firewall:
# only ssh open, ping allowed, forwarding not filtered (libvirt NAT).

destroy table inet filter

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state { established, related } accept
        iif lo accept

        meta l4proto { icmp, ipv6-icmp } accept
        # DHCPv6 replies
        ip6 saddr fe80::/10 udp dport 546 accept

        tcp dport 22 accept  # sshd (core.ssh)
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
