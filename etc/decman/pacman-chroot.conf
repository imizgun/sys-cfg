# /etc/decman/pacman-chroot.conf — managed by sys-cfg (decman/modules/core/aur.py)
# pacman.conf for decman's clean AUR build chroot: plain Arch repos + multilib.
# Without it mkarchroot bootstraps from the host's pacman.conf (CachyOS repos)
# but leaves pacman's stock config inside the chroot (no multilib), so lib32-*
# build deps (millennium) aren't found. No CachyOS repos here: arch-nspawn only
# copies /etc/pacman.d/mirrorlist into the chroot, and AUR packages are meant
# to be built against plain Arch anyway.

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
