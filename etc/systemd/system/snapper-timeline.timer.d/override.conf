# managed by sys-cfg (decman/modules/hardware/snapshots.py)
[Timer]
# every 2 days (day-of-month step syntax; imprecise by ~1 day at month
# boundaries, systemd.time(7) has no plain "every N days")
OnCalendar=
OnCalendar=*-*-1/2 00:00:00
# catch up a missed snapshot (machine was off) instead of skipping it
Persistent=true
