# User session env (systemd --user, so also D-Bus/systemd-activated apps).
#
# ELECTRON_OZONE_PLATFORM_HINT duplicates niri's `environment {}` block
# (niri/cfg/misc.kdl), which only reaches processes niri spawns directly.
# Apps launched via systemd/dbus activation (e.g. from the noctalia launcher)
# otherwise miss it, which breaks Electron apps' Wayland screen capture
# (Discord screen share crashing when started from the launcher).
ELECTRON_OZONE_PLATFORM_HINT=auto

XCURSOR_THEME=capitaine-cursors
XCURSOR_SIZE=24
GTK2_RC_FILES=${HOME}/.gtkrc-2.0

# ssh-agent from gcr (gcr-ssh-agent.socket), as on NixOS
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/gcr/ssh

# archlinux-java keeps /usr/lib/jvm/default pointing at the active JDK
# (Home Manager's programs.java exported JAVA_HOME on NixOS)
JAVA_HOME=/usr/lib/jvm/default
